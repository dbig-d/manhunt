# Builds the website and publishes it to GitHub Pages on every push to main.
# GitHub Pages only hosts the website. The game server runs on Cloudflare; put its
# address in the repository variable API_URL (Settings → Secrets and variables →
# Actions → Variables), e.g. https://manhunt.<your-name>.workers.dev
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # `npm install` rather than `npm ci`: the lockfile was made on Windows and
      # Linux needs its own native build tools.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build:pages
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
